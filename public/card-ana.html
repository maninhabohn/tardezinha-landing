<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0">
<title>Tardezinha de Ferias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  font-family: 'Fredoka', sans-serif;
  background: #7C3AED;
  width: 100%;
  min-height: 100vh;
  overflow-x: hidden;
}

.card {
  width: 100%;
  max-width: 390px;
  margin: 0 auto;
  background: #7C3AED;
}

.photo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
}

.photo-grid img {
  width: 100%;
  height: 195px;
  object-fit: cover;
  display: block;
}

.content {
  padding: 24px 20px 28px;
  text-align: center;
}

.edition-tag {
  display: inline-block;
  background: rgba(255,255,255,0.15);
  color: #FDE68A;
  font-size: 11px;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

h1 {
  color: #fff;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.15;
  margin-bottom: 16px;
}

.dates-block {
  background: rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 16px;
}

.date-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 0;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
}

.date-line + .date-line {
  border-top: 1px solid rgba(255,255,255,0.15);
}

.date-line .horario {
  font-size: 12px;
  font-weight: 500;
  color: #FDE68A;
}

.price-line {
  color: #FDE68A;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}

.adulto-note {
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 16px;
}

.cta {
  display: block;
  background: #FDE68A;
  color: #5B21B6;
  text-align: center;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
}

.local-line {
  margin-top: 14px;
  color: rgba(255,255,255,0.5);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.6;
}

.insta-line {
  color: #FDE68A;
  font-size: 13px;
  font-weight: 600;
  margin-top: 6px;
}
</style>
</head>
<body>

<div class="card">
  <div class="photo-grid">
    <img src="/fotos/giro.jpg" alt="">
    <img src="/fotos/IMG-20250713-WA0167.jpg" alt="">
    <img src="/fotos/escalada.jpg" alt="">
    <img src="/fotos/IMG-20250713-WA0179.jpg" alt="">
  </div>
  <div class="content">
    <span class="edition-tag">Ferias Escolares</span>
    <h1>A casa mais legal<br>do litoral te espera</h1>
    <div class="dates-block">
      <div class="date-line">
        <span>23/07 quarta</span>
        <span class="horario">18h as 22h</span>
      </div>
      <div class="date-line">
        <span>30/07 quarta</span>
        <span class="horario">14h-18h / 18h-22h</span>
      </div>
    </div>
    <div class="price-line">R$ 38 antecipado</div>
    <div class="adulto-note">Adulto nao paga entrada</div>
    <a class="cta" href="https://tardezinha.showdebolars.com.br/reservar">
      Quero garantir minha vaga
    </a>
    <p class="local-line">
      Casa de Festas Show de Bola<br>
      Av. G, 101 — Atlantida, Xangri-La/RS
    </p>
    <p class="insta-line">@casashowdebolaoficial</p>
  </div>
</div>

</body>
</html>
